name: TransGIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_providers:
        description: "Run public provider contract checks (network required)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend-tests:
    name: Offline backend behavior and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      NAVIGATOR_TOOLKIT_API_KEY: ""
      TRANSGIS_RUN_LIVE_TESTS: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not live" -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  live-provider-contracts:
    name: Optional public provider contracts
    if: github.event_name == 'workflow_dispatch' && inputs.live_providers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRANSGIS_RUN_LIVE_TESTS: "1"
      NAVIGATOR_TOOLKIT_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/live -m live -v --junitxml=live-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-results
          path: backend/live-test-results.xml

  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

